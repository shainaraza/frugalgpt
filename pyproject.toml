[project]
name = "frugalgpt"
version = "0.1.0"
description = "Budget-aware LLM cascades: a re-implementation of FrugalGPT (Chen, Zaharia, Zou; TMLR 2024)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frugalgpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["reference"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, numpy-specific rules
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
